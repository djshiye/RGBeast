[workspace]
resolver = "3"
members = ["crates/rgbeast-core", "crates/rgbeastd", "crates/rgbeast"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/djshiye/RGBeast"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
