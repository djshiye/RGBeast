<?xml version="1.0" encoding="UTF-8"?>
<!-- RGBeast app icon: a rounded dark tile with a soft spectrum ring and a bright centre, on the GNOME 128px grid. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f66151"/>
      <stop offset="0.25" stop-color="#f8e45c"/>
      <stop offset="0.5" stop-color="#57e389"/>
      <stop offset="0.75" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#dc8add"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#dc8add" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#dc8add" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="url(#ring)" stroke-width="12" filter="url(#blur)" opacity="0.7"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <circle cx="64" cy="64" r="30" fill="url(#glow)"/>
  <circle cx="64" cy="64" r="9" fill="#ffffff"/>
  <circle cx="64" cy="64" r="9" fill="none" stroke="#dc8add" stroke-opacity="0.6" stroke-width="2"/>
</svg>
