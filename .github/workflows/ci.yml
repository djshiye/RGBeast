name: RGBeast CI

# Every push and pull request builds and tests one x86_64 RPM on Fedora 44,
# the oldest supported release: its library sonames are forward-compatible,
# so the same package serves every newer Fedora. Pushes to main also sign it,
# publish the signed DNF repository on GitHub Pages and install it from there
# in clean Fedora 44 and 45 containers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP: rgbeast
  SITE_URL: https://djshiye.github.io/RGBeast

jobs:
  fedora:
    name: Build and test (Fedora ${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rawhide only on manual runs: it doubles the time of every push.
        release: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["44", "rawhide"]' || '["44"]') }}
    container:
      image: fedora:${{ matrix.release }}
    outputs:
      evr: ${{ steps.rpm.outputs.evr }}
    steps:
      # git first: without it checkout downloads a tarball and the commit
      # count used for the RPM release number is unavailable.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y rust cargo clippy rustfmt meson ninja-build gcc \
            systemd-devel python3-pyside6 qt6-qtsvg \
            desktop-file-utils appstream gettext rpm-build rpmdevtools rpmlint \
            cargo-rpm-macros systemd-rpm-macros python3 tar xz dbus-daemon gnupg2

      # The only step that sees the signing secret, before any project code
      # runs: it exports the public half for the package and forgets the rest.
      - name: Public signing key
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          rpmdev-setuptree
          export GNUPGHOME=$(mktemp -d)
          if [ -n "$RPM_SIGNING_KEY" ]; then
            printf '%s\n' "$RPM_SIGNING_KEY" | gpg --batch --quiet --import
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Pull requests from forks get no secrets: build with a throwaway key.
            gpg --batch --passphrase '' --quick-gen-key 'Throwaway CI key' rsa2048 sign 1d
          else
            echo "::error::The RPM_SIGNING_KEY secret is not set for this repository."
            exit 1
          fi
          gpg --batch --armor --export-options export-minimal --export > ~/rpmbuild/SOURCES/RPM-GPG-KEY-djshiye
          gpgconf --kill all
          rm -rf "$GNUPGHOME"

      # ---- Tests ----

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.release }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.release }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Daemon smoke test (session bus, simulated devices)
        run: |
          cargo build -p rgbeastd
          dbus-run-session -- sh -ec '
            ./target/debug/rgbeastd --session --simulate --state-dir "$RUNNER_TEMP/state" &
            for i in $(seq 1 50); do
              busctl --user status io.github.djshiye.RGBeast1 >/dev/null 2>&1 && break
              sleep 0.2
            done
            busctl --user call io.github.djshiye.RGBeast1 /io/github/djshiye/RGBeast1 io.github.djshiye.RGBeast1.Manager ListDevices | grep -q sim:fury
            kill %1'

      # The app's model, backend and QtDBus client; the client against the simulator too.
      - name: App unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          RGBEASTD: ${{ github.workspace }}/target/debug/rgbeastd
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          dbus-run-session -- python3 -m unittest discover -s tests -t . -v

      # Loads every QML file against the simulated devices; any QML warning fails the build.
      - name: App self-test (offscreen, simulated devices)
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          dbus-run-session -- sh -ec '
            ./target/debug/rgbeastd --session --simulate --state-dir "$RUNNER_TEMP/state-gui" &
            daemon=$!
            for i in $(seq 1 50); do
              busctl --user status io.github.djshiye.RGBeast1 >/dev/null 2>&1 && break
              sleep 0.2
            done
            for sheet in "" prefs about shortcuts menu toast; do
              python3 -m rgbeast_gui --session --self-test --delay-ms 3000 ${sheet:+--sheet $sheet} 2>&1 | tee -a "$RUNNER_TEMP/gui.log"
            done
            python3 -m rgbeast_gui --session --self-test --device sim:fury --size 600x800 2>&1 | tee -a "$RUNNER_TEMP/gui.log"
            kill "$daemon"'
          if grep -E "^qml: |warning:" "$RUNNER_TEMP/gui.log"; then
            echo "::error::The app printed QML warnings."
            exit 1
          fi
          test "$(grep -c "self-test: status=ready devices=3 warnings=0" "$RUNNER_TEMP/gui.log")" -eq 7

      - name: Meson build and validation tests
        run: |
          meson setup builddir --prefix=/usr
          meson compile -C builddir
          meson test -C builddir --print-errorlogs
          DESTDIR="$PWD/stage" meson install -C builddir

      - name: Build RPM
        id: rpm
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          git config --global --add safe.directory "$PWD"
          BUILD=$(git rev-list --count HEAD)
          DIST="$RUNNER_TEMP/dist"; mkdir -p "$DIST"
          cargo vendor --locked "$DIST/vendor" > /dev/null
          tar -C "$DIST" -cJf "$DIST/rgbeast-${VERSION}-vendor.tar.xz" vendor
          tar --no-wildcards-match-slash \
              --exclude=./target --exclude=./builddir --exclude=./stage --exclude=./.git \
              --transform "s,^\./,rgbeast-${VERSION}/," -czf "$DIST/rgbeast-${VERSION}.tar.gz" .
          cp "$DIST"/rgbeast-${VERSION}*.tar.* ~/rpmbuild/SOURCES/
          rpmbuild -ba --define "release_suffix .$BUILD" build-aux/rgbeast.spec
          rpmlint build-aux/rgbeast.spec ~/rpmbuild/RPMS/x86_64/rgbeast-*.rpm || true
          mkdir -p out
          cp ~/rpmbuild/RPMS/x86_64/rgbeast-[0-9]*.x86_64.rpm ~/rpmbuild/SRPMS/rgbeast-[0-9]*.src.rpm out/
          rpm -qp --requires out/*.x86_64.rpm
          echo "evr=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' out/*.x86_64.rpm)" >> "$GITHUB_OUTPUT"

      - name: No Python version pinned
        run: |
          if rpm -qp --requires out/*.x86_64.rpm | grep -E '^python\(abi\)|python3\.[0-9]+'; then
            echo "::error::The package pins a Python version; it must run on any Fedora."
            exit 1
          fi

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rgbeast-rpms-fedora-${{ matrix.release }}
          path: out/*.rpm
          if-no-files-found: error

  # Pushes to main: sign the Fedora 44 build and publish the repository.
  publish:
    name: Sign and assemble repository
    needs: fedora
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rgbeast-rpms-fedora-44
          path: new
      - name: Sign packages and build the repository
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          dnf install -y rpm-sign createrepo_c python3-rpm gnupg2
          printf '%s\n' "$RPM_SIGNING_KEY" | gpg --batch --quiet --import
          FPR=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          gpg --batch --armor --export-options export-minimal --export "$FPR" > "$RUNNER_TEMP/key.asc"
          rpmsign --define "_gpg_name $FPR" --addsign new/*.rpm
          python3 build-aux/dnf-repo.py --app "$APP" --url "$SITE_URL" --title RGBeast \
            --summary "RGB lighting control for GNOME" \
            --icon data/icons/hicolor/scalable/apps/io.github.djshiye.RGBeast.svg \
            --new new --site site --fetch \
            --repo-file build-aux/rgbeast.repo --key "$RUNNER_TEMP/key.asc"
          gpgconf --kill all
          echo "### Signed with key \`$FPR\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # A clean container adds the repository from its URL (or still has the old
  # per-Fedora .repo file), installs with signature checks on, and runs it.
  verify:
    name: Install on Fedora ${{ matrix.fedora }} (${{ matrix.setup }} repo file)
    needs: [fedora, deploy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
        setup: [new, legacy]
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: build-aux/verify-install.sh
          sparse-checkout-cone-mode: false
      - name: Install from the published repository
        run: |
          sh build-aux/verify-install.sh "${{ matrix.setup }}" "$APP" "$SITE_URL" \
            "${{ needs.fedora.outputs.evr }}" "$SITE_URL/fedora-\$releasever/"
      - name: Smoke test
        run: |
          dnf install -y --setopt=install_weak_deps=False dbus-daemon systemd file
          # Every library the binaries link against resolves on this release.
          ! ldd /usr/libexec/rgbeastd | grep 'not found'
          if file -b /usr/bin/rgbeast | grep -q ELF; then ! ldd /usr/bin/rgbeast | grep 'not found'; fi
          # The daemon starts on a private bus with simulated devices and answers.
          dbus-run-session -- sh -ec '
            /usr/libexec/rgbeastd --session --simulate --state-dir "$(mktemp -d)" &
            for i in $(seq 1 50); do
              busctl --user status io.github.djshiye.RGBeast1 >/dev/null 2>&1 && break
              sleep 0.2
            done
            busctl --user call io.github.djshiye.RGBeast1 /io/github/djshiye/RGBeast1 io.github.djshiye.RGBeast1.Manager ListDevices | grep -q sim:fury
            kill %1'
