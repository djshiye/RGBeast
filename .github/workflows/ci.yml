name: RGBeast CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    name: Build and test (Fedora ${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rawhide only on manual runs: it doubles the time of every push.
        release: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["44", "rawhide"]' || '["44"]') }}
    container:
      image: fedora:${{ matrix.release }}
    steps:
      # git first: without it checkout downloads a tarball and the commit
      # count used for the RPM release number is unavailable.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y rust cargo clippy rustfmt meson ninja-build gcc \
            gtk4-devel libadwaita-devel systemd-devel blueprint-compiler \
            desktop-file-utils appstream gettext rpm-build rpmdevtools rpmlint \
            cargo-rpm-macros systemd-rpm-macros python3 tar xz dbus-daemon

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.release }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.release }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Daemon smoke test (session bus, simulated devices)
        run: |
          cargo build -p rgbeastd
          dbus-run-session -- sh -ec '
            ./target/debug/rgbeastd --session --simulate --state-dir "$RUNNER_TEMP/state" &
            for i in $(seq 1 50); do
              busctl --user status io.github.djshiye.RGBeast1 >/dev/null 2>&1 && break
              sleep 0.2
            done
            busctl --user call io.github.djshiye.RGBeast1 /io/github/djshiye/RGBeast1 io.github.djshiye.RGBeast1.Manager ListDevices | grep -q sim:fury
            kill %1'

      - name: Meson build and validation tests
        run: |
          meson setup builddir --prefix=/usr
          meson compile -C builddir
          meson test -C builddir --print-errorlogs
          DESTDIR="$PWD/stage" meson install -C builddir

      - name: Build RPM
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          git config --global --add safe.directory "$PWD"
          BUILD=$(git rev-list --count HEAD)
          DIST="$RUNNER_TEMP/dist"; mkdir -p "$DIST"
          cargo vendor --locked "$DIST/vendor" > /dev/null
          tar -C "$DIST" -cJf "$DIST/rgbeast-${VERSION}-vendor.tar.xz" vendor
          tar --no-wildcards-match-slash \
              --exclude=./target --exclude=./builddir --exclude=./stage --exclude=./.git \
              --transform "s,^\./,rgbeast-${VERSION}/," -czf "$DIST/rgbeast-${VERSION}.tar.gz" .
          rpmdev-setuptree
          cp "$DIST"/rgbeast-${VERSION}*.tar.* ~/rpmbuild/SOURCES/
          rpmbuild -ba --define "release_suffix .$BUILD" build-aux/rgbeast.spec
          rpmlint build-aux/rgbeast.spec ~/rpmbuild/RPMS/x86_64/rgbeast-*.rpm || true

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rgbeast-rpm-fedora-${{ matrix.release }}
          path: ~/rpmbuild/RPMS/x86_64/rgbeast-*.rpm
          if-no-files-found: error

  # Every push to main publishes a DNF repository on GitHub Pages:
  # https://djshiye.github.io/RGBeast/rgbeast.repo
  repo:
    name: Publish DNF repository
    needs: fedora
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rgbeast-rpm-fedora-44
          path: site/fedora-44
      - name: Build repository metadata
        run: |
          dnf install -y createrepo_c
          createrepo_c site/fedora-44
          cp build-aux/rgbeast.repo site/
          printf '<!doctype html><title>RGBeast DNF repository</title><pre>sudo dnf config-manager addrepo --from-repofile=https://djshiye.github.io/RGBeast/rgbeast.repo\nsudo dnf install rgbeast</pre><p>Built from commit %s.</p>' "${GITHUB_SHA}" > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
