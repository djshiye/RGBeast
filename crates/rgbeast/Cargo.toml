[package]
name = "rgbeast"
description = "RGBeast: RGB lighting control for GNOME"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "rgbeast"

[[bin]]
name = "rgbeast"
path = "src/main.rs"

[dependencies]
rgbeast-core = { path = "../rgbeast-core" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"
gettext-rs = { version = "0.7", features = ["gettext-system"] }

[build-dependencies]
glib-build-tools = "0.22"
